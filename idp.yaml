environments:
  dev:
    branch: develop
    enabled: true
    services:
      web:
        workload:
          containerPort: 3000
          replicas: 1
          env:
            - name: NODE_ENV
              value: production
            - name: OTEL_TRACING_ENABLED
              value: "false"
            # Provide DATABASE_URL (Neon Postgres) from your platform secret
            # store; the container keeps no local database.
        service:
          port: 3000
        ingress:
          enabled: true
          className: nginx
          hosts:
            - paths:
                - path: /
                  pathType: Prefix
        livenessProbe:
          enabled: true
          httpGet:
            path: /api/health
            port: 3000
        readinessProbe:
          enabled: true
          httpGet:
            path: /api/health
            port: 3000

  production:
    branch: main
    enabled: false # Enable when production infra and secrets are ready.
    services:
      web:
        workload:
          containerPort: 3000
          # The database is shared Neon Postgres, so replicas can scale.
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          env:
            - name: NODE_ENV
              value: production
            - name: OTEL_TRACING_ENABLED
              value: "false"
        service:
          port: 3000
        ingress:
          enabled: true
          className: nginx
          hosts:
            - paths:
                - path: /
                  pathType: Prefix
        livenessProbe:
          enabled: true
          httpGet:
            path: /api/health
            port: 3000
        readinessProbe:
          enabled: true
          httpGet:
            path: /api/health
            port: 3000
